<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500' width='100%' height='100%'>
  <defs>
    <linearGradient id='goldFoil' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#f5c842'/>
      <stop offset='50%' stop-color='#e5a713'/>
      <stop offset='100%' stop-color='#c28102'/>
    </linearGradient>
    <filter id='dropShadow' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='6' stdDeviation='8' flood-color='#000000' flood-opacity='0.4'/>
    </filter>
  </defs>

  <rect width='500' height='500' fill='#f8fafc'/>

  <g filter='url(#dropShadow)'>
    <!-- Pouch Body -->
    <path d='M80,40 L420,40 L400,460 L100,460 Z' fill='url(#goldFoil)' stroke='#c28102' stroke-width='2'/>

    <!-- Seals -->
    <rect x='80' y='40' width='340' height='15' fill='#996200' opacity='0.5'/>
    <rect x='100' y='445' width='300' height='15' fill='#996200' opacity='0.5'/>

    <!-- Repeating Background Typography -->
    <g opacity='0.15' font-family='Arial Black, sans-serif' font-size='18' fill='#ffffff'>
      <text x='90' y='80'>LITTLE HEARTS</text>
      <text x='260' y='80'>LITTLE HEARTS</text>
      <text x='120' y='120'>LITTLE HEARTS</text>
      <text x='290' y='120'>LITTLE HEARTS</text>
    </g>

    <!-- Giant Red Heart Emblem in Center -->
    <g transform='translate(0, 0)'>
      <path d='M250,160 C250,110 160,100 130,170 C100,240 250,340 250,340 C250,340 400,240 370,170 C340,100 250,110 250,160 Z' fill='#d3122a' stroke='#ffffff' stroke-width='4'/>

      <!-- Britannia Logo inside Heart -->
      <rect x='180' y='165' width='140' height='26' fill='#ffffff' rx='4'/>
      <text x='250' y='183' font-family='Arial Black, sans-serif' font-size='15' font-weight='900' fill='#d3122a' text-anchor='middle'>BRITANNIA</text>

      <!-- LITTLE HEARTS Title Inside Heart -->
      <text x='250' y='240' font-family='Arial Black, Impact, sans-serif' font-size='42' font-weight='900' fill='#ffffff' text-anchor='middle' letter-spacing='-1'>LITTLE</text>
      <text x='250' y='285' font-family='Arial Black, Impact, sans-serif' font-size='44' font-weight='900' fill='#ffffff' text-anchor='middle' letter-spacing='-1'>HEARTS</text>

      <!-- CLASSIC Subtitle -->
      <text x='250' y='312' font-family='Arial Black, sans-serif' font-size='18' font-weight='900' fill='#fbc02d' text-anchor='middle'>CLASSIC</text>
    </g>

    <!-- Two Heart Biscuits at the Bottom -->
    <!-- Left Biscuit -->
    <g transform='translate(160, 360) scale(0.85)'>
      <path d='M50,30 C50,10 10,5 0,35 C-10,65 50,100 50,100 C50,100 110,65 100,35 C90,5 50,10 50,30 Z' fill='#e2a03c' stroke='#a66d17' stroke-width='4'/>
      <path d='M50,40 C50,25 20,20 12,42 C5,64 50,88 50,88 C50,88 95,64 88,42 C80,20 50,25 50,40 Z' fill='none' stroke='#f3ca81' stroke-width='3'/>
      <!-- Sugar crystals -->
      <circle cx='30' cy='45' r='2' fill='#ffffff'/>
      <circle cx='60' cy='55' r='2' fill='#ffffff'/>
      <circle cx='45' cy='70' r='2' fill='#ffffff'/>
    </g>

    <!-- Right Biscuit -->
    <g transform='translate(240, 370) scale(0.9) rotate(15)'>
      <path d='M50,30 C50,10 10,5 0,35 C-10,65 50,100 50,100 C50,100 110,65 100,35 C90,5 50,10 50,30 Z' fill='#e2a03c' stroke='#a66d17' stroke-width='4'/>
      <path d='M50,40 C50,25 20,20 12,42 C5,64 50,88 50,88 C50,88 95,64 88,42 C80,20 50,25 50,40 Z' fill='none' stroke='#f3ca81' stroke-width='3'/>
      <!-- Sugar crystals -->
      <circle cx='35' cy='40' r='2' fill='#ffffff'/>
      <circle cx='65' cy='50' r='2' fill='#ffffff'/>
      <circle cx='50' cy='65' r='2' fill='#ffffff'/>
    </g>

    <!-- Veg Symbol -->
    <rect x='115' y='420' width='20' height='20' fill='#ffffff' stroke='#00873d' stroke-width='2'/>
    <circle cx='125' cy='430' r='5' fill='#00873d'/>
  </g>
</svg>