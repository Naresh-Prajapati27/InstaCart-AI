<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#f8f9fa"/>
  <g transform="translate(120, 30)">
    <!-- Pouch -->
    <path d="M 20,30 L 340,30 L 350,520 Q 180,550 10,520 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="3"/>
    <!-- Yellow Gold Gradient Center -->
    <rect x="40" y="70" width="280" height="420" fill="#ffb300" rx="12"/>
    <!-- Big Heart Logo Saffola -->
    <path d="M 180,110 C 120,60 60,130 180,240 C 300,130 240,60 180,110 Z" fill="#ffffff" stroke="#ffeb3b" stroke-width="6"/>
    <path d="M 180,120 C 130,75 80,135 180,230 C 280,135 230,75 180,120 Z" fill="#fff59d"/>
    <text x="180" y="165" font-family="'Arial Black', sans-serif" font-weight="900" font-size="40" fill="#d50000" text-anchor="middle">Saffola</text>
    <text x="180" y="200" font-family="'Impact', sans-serif" font-size="34" fill="#f57f17" text-anchor="middle" letter-spacing="2">GOLD</text>
    <!-- Red Banner Power of 3 -->
    <rect x="80" y="260" width="200" height="40" fill="#d50000" rx="6"/>
    <text x="180" y="287" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">POWER OF 3</text>
    <!-- Text details -->
    <text x="180" y="325" font-family="sans-serif" font-size="13" fill="#37474f" text-anchor="middle" font-weight="bold">15% More Oryzanol</text>
    <text x="180" y="345" font-family="sans-serif" font-size="13" fill="#37474f" text-anchor="middle" font-weight="bold">Special Anti-Oxidant System</text>
    <text x="180" y="365" font-family="sans-serif" font-size="13" fill="#37474f" text-anchor="middle" font-weight="bold">Good MUFA PUFA Balance</text>
    <!-- Bottom Oil Bowl/Gradient -->
    <path d="M 40,380 L 320,380 L 320,490 Q 180,510 40,490 Z" fill="#8d6e63"/>
    <text x="180" y="420" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">MULTI-SOURCE EDIBLE OIL</text>
    <!-- Right side yellow bar 1L -->
    <rect x="290" y="30" width="60" height="490" fill="#ffc107"/>
    <text x="320" y="250" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" transform="rotate(-90 320 250)">Cooking Oil</text>
    <text x="320" y="450" font-family="'Impact', sans-serif" font-size="42" fill="#d50000" text-anchor="middle">1L</text>
  </g>
</svg>