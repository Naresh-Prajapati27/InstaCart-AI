<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400' width='100%' height='100%'>
        <rect width='400' height='400' fill='#f8fafc'/>
        <g>
            <!-- Yellow Pack -->
            <rect x='60' y='70' width='280' height='260' fill='#FCE029' stroke='#E5C100' stroke-width='4' rx='10'/>
            <!-- Parle Red Logo -->
            <rect x='80' y='90' width='80' height='30' fill='#D3122A' rx='4'/>
            <text x='120' y='111' font-family='Arial' font-size='16' font-weight='bold' fill='#FFFFFF' text-anchor='middle'>PARLE</text>
            <!-- Large G -->
            <text x='270' y='145' font-family='Times New Roman, serif' font-size='70' font-weight='bold' fill='#D3122A' text-anchor='middle'>G</text>
            <!-- Parle Girl Icon / Illustration -->
            <circle cx='130' cy='185' r='35' fill='#FFF0C2' stroke='#D3122A' stroke-width='2'/>
            <path d='M110 170 Q130 150 150 170' stroke='#333' stroke-width='6' fill='none'/> <!-- Hair -->
            <circle cx='120' cy='180' r='3' fill='#333'/>
            <circle cx='140' cy='180' r='3' fill='#333'/>
            <path d='M123 195 Q130 205 137 195' stroke='#D3122A' stroke-width='2' fill='none'/>
            <!-- Biscuit Rectangle -->
            <rect x='190' y='180' width='130' height='85' fill='#E0A13C' stroke='#B57918' stroke-width='3' rx='6'/>
            <rect x='196' y='186' width='118' height='73' fill='none' stroke='#B57918' stroke-width='1' stroke-dasharray='4,3'/>
            <text x='255' y='228' font-family='Times New Roman, serif' font-size='22' font-weight='bold' fill='#7A4C00' text-anchor='middle'>Parle-G</text>
        </g>
    </svg>