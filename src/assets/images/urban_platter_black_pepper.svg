  <text x="300" y="510" font-family="'Helvetica Neue', sans-serif" font-weight="900" font-size="20" fill="#111827" text-anchor="middle" letter-spacing="1">URBAN PLATTER</text>
  <text x="300" y="535" font-family="'Georgia', serif" font-weight="bold" font-size="16" fill="#b45309" text-anchor="middle">Black Pepper Whole</text>
