    <circle cx="250" cy="295" r="19"/><circle cx="280" cy="285" r="18"/><circle cx="320" cy="290" r="20"/>
    <circle cx="350" cy="310" r="17"/><circle cx="380" cy="280" r="16"/><circle cx="210" cy="330" r="18"/>
