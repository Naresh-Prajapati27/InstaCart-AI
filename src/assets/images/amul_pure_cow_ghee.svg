<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#f8f9fa"/>
  <!-- Yellow Tin -->
  <g transform="translate(110, 50)">
    <!-- Red Lid -->
    <ellipse cx="190" cy="60" rx="190" ry="40" fill="#d50000"/>
    <rect x="0" y="60" width="380" height="30" fill="#b71c1c"/>
    <ellipse cx="190" cy="90" rx="190" ry="35" fill="#d50000"/>
    <text x="190" y="70" font-family="'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">Amul</text>
    <!-- Yellow Main Body -->
    <rect x="15" y="105" width="350" height="380" fill="#ffeb3b"/>
    <ellipse cx="190" cy="485" rx="175" ry="30" fill="#fbc02d"/>
    <!-- Logo Text -->
    <text x="190" y="175" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" fill="#d50000" text-anchor="middle">Amul</text>
    <text x="190" y="215" font-family="'Trebuchet MS', sans-serif" font-weight="bold" font-size="30" fill="#1a237e" text-anchor="middle">Pure Cow Ghee</text>
    <!-- Cow and Calf Illustration -->
    <!-- Green Tree -->
    <circle cx="190" cy="280" r="60" fill="#4caf50"/>
    <circle cx="150" cy="300" r="45" fill="#388e3c"/>
    <circle cx="230" cy="300" r="45" fill="#388e3c"/>
    <!-- Green Grass Ground -->
    <ellipse cx="190" cy="420" rx="120" ry="30" fill="#81c784"/>
    <!-- White Cow Body -->
    <ellipse cx="220" cy="380" rx="45" ry="30" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
    <circle cx="260" cy="360" r="20" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
    <!-- Red cloth on cow -->
    <rect x="200" y="365" width="35" height="25" fill="#d50000" rx="4"/>
    <!-- Calf -->
    <ellipse cx="140" cy="400" rx="25" ry="16" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
    <circle cx="120" cy="390" r="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  </g>
</svg>