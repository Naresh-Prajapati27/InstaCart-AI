<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#f8f9fa"/>
  <!-- Box Body -->
  <g transform="translate(130, 40)">
    <!-- Main Box -->
    <rect x="0" y="0" width="340" height="520" fill="#e65100" rx="8"/>
    <!-- Top Red Banner -->
    <rect x="25" y="30" width="290" height="70" fill="#d50000" rx="6"/>
    <text x="170" y="80" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">EVEREST</text>
    <!-- Title Text -->
    <text x="170" y="150" font-family="'Trebuchet MS', sans-serif" font-weight="bold" font-size="38" fill="#ffffff" text-anchor="middle">Meat</text>
    <text x="170" y="195" font-family="'Trebuchet MS', sans-serif" font-weight="bold" font-size="42" fill="#ffffff" text-anchor="middle">Masala</text>
    <!-- Veg symbol top right -->
    <rect x="285" y="115" width="20" height="20" stroke="#00e676" stroke-width="2" fill="#fff"/>
    <circle cx="295" cy="125" r="5" fill="#00e676"/>
    <!-- Curry Bowl Graphic Area -->
    <rect x="20" y="230" width="300" height="260" fill="#bf360c" rx="8"/>
    <!-- Dish illustration -->
    <ellipse cx="170" cy="380" rx="120" ry="60" fill="#3e2723"/>
    <ellipse cx="170" cy="375" rx="110" ry="50" fill="#d84315"/>
    <path d="M 110,360 Q 150,330 200,370 Q 160,400 110,360 Z" fill="#5d4037"/>
    <path d="M 180,350 Q 230,320 240,360 Q 210,390 180,350 Z" fill="#4e342e"/>
    <!-- Rice Bowl top left -->
    <ellipse cx="80" cy="280" rx="45" ry="25" fill="#ffffff"/>
    <ellipse cx="80" cy="275" rx="40" ry="20" fill="#ffeb3b"/>
    <!-- Garnish green rings -->
    <circle cx="170" cy="360" r="12" fill="none" stroke="#76ff03" stroke-width="3"/>
    <circle cx="185" cy="368" r="10" fill="none" stroke="#76ff03" stroke-width="3"/>
  </g>
</svg>