<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400' width='100%' height='100%'>
        <rect width='400' height='400' fill='#f8fafc'/>
        <g>
            <!-- Yellow/Red Pack -->
            <rect x='60' y='75' width='280' height='250' rx='16' fill='#FFCC00'/>
            <path d='M60 75 L340 75 L340 140 L60 180 Z' fill='#E31837'/>
