<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500' width='100%' height='100%'>
  <defs>
    <linearGradient id='purpleBg' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#7b1fa2'/>
      <stop offset='60%' stop-color='#4a148c'/>
      <stop offset='100%' stop-color='#311b92'/>
    </linearGradient>
    <linearGradient id='yellowHeader' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#ffeb3b'/>
      <stop offset='100%' stop-color='#fbc02d'/>
    </linearGradient>
    <filter id='dropShadow' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='6' stdDeviation='8' flood-color='#000000' flood-opacity='0.4'/>
    </filter>
  </defs>

  <rect width='500' height='500' fill='#f8fafc'/>

  <g filter='url(#dropShadow)'>
    <!-- Pouch Body -->
    <path d='M90,50 L410,50 L395,450 L105,450 Z' fill='url(#purpleBg)' stroke='#4a148c' stroke-width='2'/>

    <!-- Top Yellow Header Band with Ziplock -->
    <path d='M90,50 L410,50 L406,90 L94,90 Z' fill='url(#yellowHeader)'/>
    <line x1='94' y1='62' x2='406' y2='62' stroke='#f57f17' stroke-width='1.5' stroke-dasharray='4,2'/>
    <text x='250' y='78' font-family='Arial, sans-serif' font-size='9' font-weight='bold' fill='#000000' text-anchor='middle'>EASY TO STORE FAMILY PACK - ZIP LOCK KEEPS CONTENTS FRESH</text>

    <!-- Veg Icon -->
    <rect x='360' y='100' width='22' height='22' fill='#ffffff' stroke='#00873d' stroke-width='2'/>
    <circle cx='371' cy='111' r='5' fill='#00873d'/>

    <!-- Bikano Red Oval Logo -->
    <ellipse cx='250' cy='135' rx='65' ry='28' fill='#e31837' stroke='#ffffff' stroke-width='3'/>
    <text x='250' y='145' font-family='Arial Black, sans-serif' font-size='26' font-weight='900' fill='#ffffff' text-anchor='middle'>BIKANO</text>

    <!-- Product Title Khatta Meetha -->
    <text x='250' y='200' font-family='Arial Black, sans-serif' font-size='34' font-weight='900' fill='#ffffff' text-anchor='middle'>Khatta Meetha</text>
    <text x='250' y='220' font-family='Arial, sans-serif' font-size='11' font-weight='bold' fill='#ffeb3b' text-anchor='middle'>Sweet &amp; Sour Crunchy Mix of Cereals, Lentil &amp; Rice Flakes</text>

    <!-- Mixture Photo Window Section -->
    <path d='M102,240 L398,240 L395,400 L105,400 Z' fill='#d48b16'/>
    <!-- Texture of Mixture -->
    <path d='M110,250 Q200,270 390,250 M120,290 Q250,310 380,280 M110,330 Q220,360 380,340 M120,380 Q250,400 380,370' stroke='#fec107' stroke-width='4' fill='none'/>
    <!-- Green peas -->
    <circle cx='140' cy='270' r='6' fill='#4caf50'/>
    <circle cx='220' cy='310' r='7' fill='#4caf50'/>
    <circle cx='330' cy='280' r='6' fill='#4caf50'/>
    <circle cx='290' cy='360' r='6' fill='#4caf50'/>
    <!-- Peanuts -->
    <ellipse cx='180' cy='290' rx='12' ry='7' fill='#8d331b' transform='rotate(15 180 290)'/>
    <ellipse cx='270' cy='320' rx='13' ry='7' fill='#8d331b' transform='rotate(-20 270 320)'/>
    <ellipse cx='350' cy='350' rx='12' ry='7' fill='#8d331b' transform='rotate(30 350 350)'/>
    <!-- Sago / Puffed rice -->
    <circle cx='160' cy='340' r='6' fill='#ffffff'/>
    <circle cx='240' cy='270' r='5' fill='#ffffff'/>
    <circle cx='310' cy='330' r='6' fill='#ffffff'/>

    <!-- Bottom Yellow Border with Mascot & Badges -->
    <path d='M105,400 L395,400 L395,450 L105,450 Z' fill='#ffeb3b'/>

    <!-- Chef Mascot Icon (Bottom Left) -->
    <g transform='translate(125, 370) scale(0.7)'>
      <circle cx='30' cy='30' r='25' fill='#e31837'/>
      <!-- Turban -->
      <path d='M10,25 C10,10 50,10 50,25 Z' fill='#ffffff'/>
      <!-- Mustache -->
      <path d='M15,35 Q30,45 45,35' stroke='#000000' stroke-width='4' fill='none'/>
      <text x='30' y='65' font-family='Arial, sans-serif' font-size='9' font-weight='bold' fill='#e31837' text-anchor='middle'>Barson Se Bikano</text>
    </g>

    <!-- Feature Badges Bottom Right -->
    <g transform='translate(250, 412) scale(0.8)'>
      <rect x='0' y='0' width='55' height='24' fill='#e31837' rx='12'/>
      <text x='27' y='15' font-family='Arial, sans-serif' font-size='8' fill='#ffffff' text-anchor='middle'>Crunchy Fun</text>

      <rect x='62' y='0' width='65' height='24' fill='#e31837' rx='12'/>
      <text x='94' y='15' font-family='Arial, sans-serif' font-size='8' fill='#ffffff' text-anchor='middle'>No Artificial</text>

      <rect x='134' y='0' width='60' height='24' fill='#e31837' rx='12'/>
      <text x='164' y='15' font-family='Arial, sans-serif' font-size='8' fill='#ffffff' text-anchor='middle'>No Added</text>
    </g>
  </g>
</svg>